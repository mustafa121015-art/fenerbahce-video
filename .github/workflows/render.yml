name: Fenerbahce Video Render

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sistem Paketlerini (ffmpeg, chromium) Hazırla
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Bağımlılıkları Yükle
        run: npm install

      - name: Videoyu Otomatik Yap
        run: node videoyu-yap.mjs

      - name: Bitmiş Videoyu Yükle
        uses: actions/upload-artifact@v4
        with:
          name: fenerbahce-video
          path: out/*.mp4