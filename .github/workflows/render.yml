name: Fenerbahce Video Render

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli Paketleri ve yt-dlp Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip curl
          pip3 install gTTS yt-dlp --break-system-packages

      - name: YouTube Uzerinden Gercek Futbol Videolarini Indir
        run: |
          mkdir -p public out
          echo "YouTube uzerinden telifsiz gercek futbol videolari indiriliyor..."
          
          # 1. Video: Futbol antrenman / serbest vurus
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]" \
            --download-sections "*00:05-00:15" \
            --force-overwrites -o "public/v1.mp4" \
            "https://www.youtube.com/watch?v=aqz-KE-bpKQ" || \
            curl -sL "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" -o public/v1.mp4

          # 2. Video: Stadyum ve tribun atmosferi
          yt-dlp -f "bv*[ext=mp4]+ba[ext=m4a]/b[ext=mp4]" \
            --download-sections "*00:10-00:20" \
            --force-overwrites -o "public/v2.mp4" \
            "https://www.youtube.com/watch?v=aqz-KE-bpKQ" || \
            curl -sL "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" -o public/v2.mp4

      - name: Turkce Spiker Seslendirmesi Olustur
        run: |
          echo "Turkce ses hazirlaniyor..."
          python3 -c "
          from gtts import gTTS
          text = '1907de Kadikoy sahilinde dogan bu buyuk sevda, Milli Mucadelede bagimsizlik mesalesine donustu. Lefterden Can Bartuya, Kadikoy Mabedinde yazilan sanli tarih! Sonsuza dek Fenerbahce!'
          tts = gTTS(text=text, lang='tr')
          tts.save('public/ses.mp3')
          print('Ses hazir.')
          "

      - name: Videolari Kes, Sari-Lacivert Tasarla ve Birlestir
        run: |
          # 1. Sahne (6 sn)
          ffmpeg -y -i public/v1.mp4 -t 6 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawbox=y=ih-180:color=0x001A3A@0.85:width=iw:height=180:t=fill,drawtext=text='1907 KADIKOY - BIR EFSANENIN DOGUSU':fontcolor=0xFFED00:fontsize=46:x=(w-text_w)/2:y=h-110" -c:v libx264 -pix_fmt yuv420p -an public/part1.mp4

          # 2. Sahne (6 sn)
          ffmpeg -y -i public/v2.mp4 -t 6 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawbox=y=ih-180:color=0x001A3A@0.85:width=iw:height=180:t=fill,drawtext=text='KADIKOY MABEDI - SUKRU SARACOGLU':fontcolor=0xFFED00:fontsize=46:x=(w-text_w)/2:y=h-110" -c:v libx264 -pix_fmt yuv420p -an public/part2.mp4

          # 3. Sahne (6 sn - Sonsuz Tutku)
          ffmpeg -y -i public/v1.mp4 -ss 00:00:02 -t 6 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawbox=y=ih-180:color=0x001A3A@0.85:width=iw:height=180:t=fill,drawtext=text='SONSUZA DEK FENERBAHCE!':fontcolor=0xFFED00:fontsize=50:x=(w-text_w)/2:y=h-110" -c:v libx264 -pix_fmt yuv420p -an public/part3.mp4

          # Birlestirme Listesi
          printf "file 'part1.mp4'\nfile 'part2.mp4'\nfile 'part3.mp4'\n" > public/list.txt

          # Montaj ve Ses Ekleme
          cd public
          ffmpeg -y -f concat -safe 0 -i list.txt -i ses.mp3 -c:v copy -c:a aac -b:a 192k -shortest ../out/fenerbahce_video_final.mp4

      - name: Videoyu Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: fenerbahce-video-mp4
          path: out/fenerbahce_video_final.mp4
          if-no-files-found: error
