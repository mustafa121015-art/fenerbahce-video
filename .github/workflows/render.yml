name: Fenerbahce AI Video Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip curl
          pip3 install gTTS replicate --break-system-packages

      - name: Yapay Zeka ile Sahneleri Uret
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          mkdir -p public out
          echo "Yapay zeka videolari ciziyor..."
          python3 -c "
          import replicate
          import urllib.request
          import os

          prompts = [
              'Cinematic shot of historic 1907 Istanbul Kadikoy coast, retro football players with yellow and navy striped jersey, dramatic sun rays, realistic 4k',
              'Epic football stadium, thousands of fans waving massive yellow and navy blue flags, yellow flare smoke rising, match atmosphere, cinematic',
              'Slow motion cinematic football player celebrating a goal sliding on grass, wearing yellow and dark navy blue jersey, stadium lights, 4k'
          ]

          for idx, p in enumerate(prompts, 1):
              print(f'Sahne {idx} uretiliyor...')
              output = replicate.run(
                  'minimax/video-01',
                  input={'prompt': p, 'prompt_optimizer': True}
              )
              video_url = str(output)
              print(f'Sahne {idx} bitti, indiriliyor: {video_url}')
              urllib.request.urlretrieve(video_url, f'public/ai_{idx}.mp4')

          print('Tum yapay zeka sahneleri basariyla alindi!')
          "

      - name: Turkce Spiker Seslendirmesi Olustur
        run: |
          echo "Turkce ses dosyasi hazirlaniyor..."
          python3 -c "
          from gtts import gTTS
          text = '1907de Kadikoy sahilinde dogan bu buyuk sevda, Milli Mucadelede bagimsizlik mesalesine donustu. Lefterden Can Bartuya, Kadikoy Mabedinde yazilan sanli tarih! Sonsuza dek Fenerbahce!'
          tts = gTTS(text=text, lang='tr')
          tts.save('public/ses.mp3')
          print('Ses hazir.')
          "

      - name: AI Videolari Kes, Sari-Lacivert Tasarla ve Birlestir
        run: |
          # 1. Sahne (5 sn)
          ffmpeg -y -i public/ai_1.mp4 -t 5 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawbox=y=ih-180:color=0x001A3A@0.85:width=iw:height=180:t=fill,drawtext=text='1907 KADIKOY - BIR EFSANENIN DOGUSU':fontcolor=0xFFED00:fontsize=46:x=(w-text_w)/2:y=h-110" -c:v libx264 -pix_fmt yuv420p -an public/part1.mp4

          # 2. Sahne (5 sn)
          ffmpeg -y -i public/ai_2.mp4 -t 5 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawbox=y=ih-180:color=0x001A3A@0.85:width=iw:height=180:t=fill,drawtext=text='KADIKOY MABEDI - SUKRU SARACOGLU':fontcolor=0xFFED00:fontsize=46:x=(w-text_w)/2:y=h-110" -c:v libx264 -pix_fmt yuv420p -an public/part2.mp4

          # 3. Sahne (5 sn)
          ffmpeg -y -i public/ai_3.mp4 -t 5 -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,drawbox=y=ih-180:color=0x001A3A@0.85:width=iw:height=180:t=fill,drawtext=text='SONSUZA DEK FENERBAHCE!':fontcolor=0xFFED00:fontsize=50:x=(w-text_w)/2:y=h-110" -c:v libx264 -pix_fmt yuv420p -an public/part3.mp4

          # Birlestirme Listesi
          printf "file 'part1.mp4'\nfile 'part2.mp4'\nfile 'part3.mp4'\n" > public/list.txt

          # Montaj ve Ses Ekleme
          cd public
          ffmpeg -y -f concat -safe 0 -i list.txt -i ses.mp3 -c:v copy -c:a aac -b:a 192k -shortest ../out/fenerbahce_ai_video.mp4

      - name: Videoyu Artifact Olarak Yukle
        uses: actions/upload-artifact@v4
        with:
          name: fenerbahce-ai-video
          path: out/fenerbahce_ai_video.mp4
          if-no-files-found: error
